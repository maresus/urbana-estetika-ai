<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Urbana Estetika — AI pomočnik</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; background: #f5f0e8; font-family: system-ui, sans-serif; }
    .hero {
      position: relative;
      width: 100vw;
      /* naravno razmerje 1920:600 = 31.25vw, min 340px za mobile */
      height: clamp(340px, 31.25vw, 600px);
      overflow: hidden;
      background: #2a1f10;
    }
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(42,31,16,0.30) 0%, rgba(42,31,16,0.08) 50%, transparent 100%);
    }
    .below-hero {
      width: 100%;
      min-height: calc(100vh - clamp(340px, 31.25vw, 600px));
      background: #f5f0e8;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img class="hero-img" src="/static/bg.png" alt="Dr. Nina Suvorov — Urbana Estetika">
    <div class="hero-overlay"></div>
  </div>
  <div class="below-hero"></div>
  <script src="/static/widget.js?v=3"></script>
</body>
</html>
